name: AI chat regression
on:
  push:
    paths:
      - "apps/desktop/src/**"
      - "apps/desktop/tests/ai-*.test.mjs"
      - "apps/desktop/tests/browser/ai-sanitario-append.spec.mjs"
      - "apps/desktop/tests/browser/ai-equipment-productivity.spec.mjs"
      - "apps/desktop/tests/browser/ai-selected-bathroom-preview.spec.mjs"
      - "apps/desktop/tests/browser/ai-bathroom-preserve.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-copilot.spec.mjs"
      - "apps/desktop/tests/browser/ai-full-budget-review.spec.mjs"
      - "apps/desktop/tests/browser/ai-conversation-context.spec.mjs"
      - "apps/desktop/tests/browser/ai-app-capabilities.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-preparation.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-sections.spec.mjs"
      - "apps/desktop/tests/browser/ai-chat-create-approval.spec.mjs"
      - "apps/desktop/tests/browser/ai-catalog-chat.spec.mjs"
      - "apps/desktop/tests/browser/ai-approved-load.spec.mjs"
      - "apps/desktop/tests/browser/ai-acu-chat.spec.mjs"
      - "apps/desktop/tests/browser/ai-library-acu.spec.mjs"
      - "crates/cpobras-storage/src/budget_sections.rs"
      - "crates/cpobras-storage/src/section_batches.rs"
      - "apps/desktop/src-tauri/src/commands/sections.rs"
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/permissions/workspace.toml"
      - ".github/workflows/ai-chat-regression.yml"
  pull_request:
    paths:
      - "apps/desktop/src/**"
      - "apps/desktop/tests/ai-*.test.mjs"
      - "apps/desktop/tests/browser/ai-sanitario-append.spec.mjs"
      - "apps/desktop/tests/browser/ai-equipment-productivity.spec.mjs"
      - "apps/desktop/tests/browser/ai-selected-bathroom-preview.spec.mjs"
      - "apps/desktop/tests/browser/ai-bathroom-preserve.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-copilot.spec.mjs"
      - "apps/desktop/tests/browser/ai-full-budget-review.spec.mjs"
      - "apps/desktop/tests/browser/ai-conversation-context.spec.mjs"
      - "apps/desktop/tests/browser/ai-app-capabilities.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-preparation.spec.mjs"
      - "apps/desktop/tests/browser/ai-library-acu.spec.mjs"
      - "apps/desktop/tests/browser/ai-budget-sections.spec.mjs"
      - "crates/cpobras-storage/src/budget_sections.rs"
      - "crates/cpobras-storage/src/section_batches.rs"
      - "apps/desktop/src-tauri/src/commands/sections.rs"
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/permissions/workspace.toml"
      - ".github/workflows/ai-chat-regression.yml"

jobs:
  sanitary-addition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate and validate the live app knowledge map
        working-directory: apps/desktop
        run: |
          node ../../tools/generate-ai-inventory.mjs
          node ../../tools/generate-ai-inventory.mjs --check
      - name: Unit tests for AI requests and ACU additions
        working-directory: apps/desktop
        run: node --test tests/ai-conversation-context.test.mjs tests/ai-assistant.test.mjs tests/ai-acu.test.mjs tests/ai-acu-addition.test.mjs tests/ai-acu-productivity.test.mjs tests/ai-budget-tools.test.mjs tests/ai-section-operations.test.mjs tests/ai-native-permissions.test.mjs tests/ai-app-knowledge.test.mjs
      - name: Install Chromium
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      - name: End-to-end chat ACU addition
        working-directory: apps/desktop
        run: npm run test:browser -- ai-conversation-context.spec.mjs ai-budget-sections.spec.mjs ai-budget-preparation.spec.mjs ai-budget-copilot.spec.mjs ai-bathroom-preserve.spec.mjs ai-sanitario-append.spec.mjs ai-equipment-productivity.spec.mjs ai-selected-bathroom-preview.spec.mjs ai-acu-chat.spec.mjs ai-approved-load.spec.mjs ai-catalog-chat.spec.mjs ai-chat-create-approval.spec.mjs ai-full-budget-review.spec.mjs ai-app-capabilities.spec.mjs ai-library-acu.spec.mjs

  section-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and test safe rubro operations
        run: cargo test -p cpobras-storage conversational_section_crud_preserves_lines_children_and_rejects_stale_delete -- --nocapture
      - name: Validate reviewed rubro transactions and protected conversions
        run: cargo test -p cpobras-storage reviewed_section -- --nocapture
      - name: Validate unified atomic budget classification
        run: cargo test -p cpobras-storage reviewed_batch_moves_rubros_atomically_without_touching_prices -- --nocapture

  desktop-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Compile desktop Rust commands independently of formatting
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
