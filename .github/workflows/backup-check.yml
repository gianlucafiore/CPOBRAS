name: Backup portability
on:
  push:
    paths: [".gitattributes", "apps/desktop/src-tauri/src/backups.rs", "apps/desktop/src-tauri/src/database.rs", "crates/**", "tools/backup-check/**", ".github/workflows/backup-check.yml"]
  pull_request:
    paths: [".gitattributes", "apps/desktop/src-tauri/src/backups.rs", "apps/desktop/src-tauri/src/database.rs", "crates/**", "tools/backup-check/**", ".github/workflows/backup-check.yml"]
jobs:
  backup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Test production backup manager
        run: cargo test --manifest-path tools/backup-check/Cargo.toml --locked
      - name: Test database schema compatibility
        run: cargo test --package cpobras-storage maintenance::tests --locked
