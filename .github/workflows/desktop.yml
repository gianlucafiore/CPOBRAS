name: Desktop checks
on:
  push:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build
      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Check desktop Rust compilation
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
