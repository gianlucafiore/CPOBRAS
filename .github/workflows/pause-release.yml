name: Pause desktop release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del build de release que se debe cancelar"
        required: true
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel requested release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run cancel "$RUN_ID"
