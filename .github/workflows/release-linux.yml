name: Desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente, por ejemplo v0.1.2"
        required: true
        default: "v0.1.4"
permissions:
  contents: write
concurrency:
  group: release-desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: 4
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'PY'
          import json, os
          version=json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version']
          assert os.environ['RELEASE_TAG']=='v'+version, 'La etiqueta no coincide con la versión de la aplicación'
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 patchelf squashfs-tools desktop-file-utils xvfb xauth dbus-x11 x11-utils scrot
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Frontend checks
        run: npm --prefix apps/desktop test
      - name: Build AppImage
        working-directory: apps/desktop
        run: npm run package:linux
      - name: Check packaged application
        run: |
          artifacts=(apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#artifacts[@]}" -eq 1
          docker build -f tools/Dockerfile.appimage-smoke -t cpobras-appimage-smoke .
          mkdir -p appimage-smoke
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$(realpath "${artifacts[0]}"),dst=/opt/CPOBRAS.AppImage,readonly" \
            --mount "type=bind,src=$PWD/tools,dst=/checks,readonly" \
            --mount "type=bind,src=$PWD/appimage-smoke,dst=/output" \
            -e TMPDIR=/output -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            cpobras-appimage-smoke bash /checks/smoke-appimage.sh /opt/CPOBRAS.AppImage
      - name: Prepare download and checksums
        run: |
          mkdir -p release-assets
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cd release-assets
          sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: CPOBRAS-${{ env.RELEASE_TAG }}-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'La etiqueta no coincide con la versión de la aplicación' }
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Build portable executable
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Check and prepare portable executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path apps/desktop/src-tauri/target/release/cpobras-desktop.exe).Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "CPOBRAS terminó antes de abrir su ventana: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0) { $ready = $true; break }
            }
            if (-not $ready) { throw 'CPOBRAS no abrió su ventana en Windows' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $name = "CPOBRAS_$($env:RELEASE_TAG.Substring(1))_windows_x86_64_portable.exe"
          Copy-Item $exe "release-assets/$name"
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: CPOBRAS-${{ env.RELEASE_TAG }}-windows-x86_64
          path: release-assets/*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: 4
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Validate version
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const config=JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")); if (process.env.RELEASE_TAG !== "v"+config.version) process.exit(1)'
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Build portable application
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app -- --locked
      - name: Check and archive portable application
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          app="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos/CPOBRAS.app"
          test -x "$app/Contents/MacOS/cpobras-desktop"
          binary="$app/Contents/MacOS/cpobras-desktop"
          "$binary" > /tmp/cpobras-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            sleep 1
            kill -0 "$pid" || { cat /tmp/cpobras-smoke.log; exit 1; }
          done
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
          mkdir -p release-assets
          name="CPOBRAS_${RELEASE_TAG#v}_macos_${ARCH}_portable.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/$name"
          (cd release-assets && shasum -a 256 "$name" > "SHA256SUMS-macos-$ARCH.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: CPOBRAS-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [appimage, windows, macos]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: CPOBRAS-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true
      - name: Check release assets
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*portable.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*macos_*_portable.zip' | wc -l)" -eq 2
          cd release-assets
          cat SHA256SUMS SHA256SUMS-windows.txt SHA256SUMS-macos-*.txt > SHA256SUMS-all.txt
          sha256sum -c SHA256SUMS-all.txt
          mv SHA256SUMS-all.txt SHA256SUMS
          rm SHA256SUMS-windows.txt SHA256SUMS-macos-*.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft.txt 2>/dev/null; then
            test "$(cat /tmp/release-draft.txt)" = true || { echo 'La versión ya está publicada; no se reemplazará.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CPOBRAS $RELEASE_TAG — Linux, Windows y macOS" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
