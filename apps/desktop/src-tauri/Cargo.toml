[package]
name = "cpobras-desktop"
version = "0.1.3"
edition = "2021"
build = "build.rs"

[lib]
name = "cpobras_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
cpobras-core = { path = "../../../crates/cpobras-core" }
cpobras-storage = { path = "../../../crates/cpobras-storage" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
tempfile = "3"

rust_decimal = { version = "1", features = ["serde"] }
tauri-plugin-dialog = "2"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
sha2 = "0.10"
base64 = "=0.22.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

glib = "=0.18.5"
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }

[patch.crates-io]
glib = { path = "../../../vendor/glib-0.18.5" }

# Exercise the upstream UB fix with optimizer-enabled GLib, including in debug IPC tests.
[profile.dev.package.glib]
opt-level = 3
